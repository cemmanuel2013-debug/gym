<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitbyclin">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <title>Fitbyclin Fitness App</title>
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <div id="rest-bar" hidden>
    <div class="rest-fill"></div>
    <span class="rest-label">Pause</span>
    <b class="rest-time">0:00</b>
    <button type="button" data-rest="plus">+15 s</button>
    <button type="button" data-rest="skip">Weiter</button>
  </div>

  <nav id="tabbar" aria-label="Hauptnavigation">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Heute</span>
    </a>
    <a href="#/calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Kalender</span>
    </a>
    <a href="#/plan" data-tab="plan">
      <svg viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/></svg>
      <span>Plan</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>
      <span>Verlauf</span>
    </a>
    <a href="#/chat" data-tab="chat">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
      <span>Chat</span>
    </a>
  </nav>

  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
